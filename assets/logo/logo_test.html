<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo Concept Test</title>
<style>
  body {
    background: #090D16;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  svg {
    width: 400px;
    height: 400px;
  }
</style>
</head>
<body>

<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradient: Electric Indigo to Vivid Cyan -->
    <linearGradient id="grad-primary" x1="140" y1="140" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Secondary Gradient: Cyan to Emerald Spark -->
    <linearGradient id="grad-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background App Badge / Squircle -->
  <rect id="bg-badge" x="32" y="32" width="448" height="448" rx="112" fill="#0E1322" stroke="#1F293D" stroke-width="2.5"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="160" fill="url(#grad-primary)" opacity="0.08" filter="blur(40px)"/>

  <!-- Group for Logo Core Geometry -->
  <g id="logo-mark" transform="translate(0, 0)">
    
    <!-- Path 1: The 'F' Ascender & Top Arm -->
    <path id="path-ascender"
          d="M 180 356 V 196 C 180 162 208 144 242 144 H 332"
          stroke="url(#grad-primary)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Path 2: Dynamic Infinity / Workflow Loop (Crossbar extending into continuous loop) -->
    <path id="path-infinity"
          d="M 180 262 C 220 262 250 220 290 220 C 330 220 356 248 356 280 C 356 312 330 340 290 340 C 250 340 220 298 180 298 C 140 298 114 326 114 358 C 114 390 140 418 180 418"
          stroke="url(#grad-primary)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.3"/>

  </g>
</svg>

</body>
</html>
